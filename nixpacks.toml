# Nixpacks configuration for AbachaOnline Backend
# https://nixpacks.com/docs/configuration/file

# Specify Node.js provider
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_18", "npm"]

[phases.install]
cmds = ["cd backend && npm install"]

[phases.build]
cmds = []

[start]
cmd = "cd backend && npm start"
