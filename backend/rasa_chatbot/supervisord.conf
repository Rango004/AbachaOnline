[supervisord]
nodaemon=true
user=root

[program:rasa]
command=/bin/bash -c "rasa run --enable-api --port %(ENV_PORT)s --cors '*' -m models/model.tar.gz"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:actions]
command=rasa run actions --port 5055
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
