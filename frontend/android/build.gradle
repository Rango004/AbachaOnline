// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Redirect build directories for Capacitor plugins (from node_modules)
    // This fixes Windows long path issues and OneDrive file locking problems
    afterEvaluate { project ->
        if (project.projectDir.absolutePath.contains('node_modules')) {
            def pluginName = project.name.replace('capacitor-', '')
            project.buildDir = new File(rootProject.buildDir, "capacitor-plugins/${pluginName}")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
