apply plugin: 'com.android.application'

// Redirect build output outside OneDrive to avoid file locking
buildDir = new File(rootProject.buildDir, "app")

// Helper function to read version name
def getVersionName() {
    try {
        def packageJsonFile = new File(rootProject.projectDir.parentFile, 'package.json')
        if (packageJsonFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
            return json.version ?: "1.0.0"
        }
    } catch (Exception e) {
        println "DEBUG: Error parsing package.json: ${e.message}"
    }
    return "1.0.0"
}

// Helper function to read version code
def getVersionCode() {
    try {
        def versionPropsFile = file('version.properties')
        if (versionPropsFile.exists()) {
            def props = new Properties()
            versionPropsFile.withInputStream { props.load(it) }
            return (props['VERSION_CODE'] ?: "1").toInteger()
        }
    } catch (Exception e) {
        println "DEBUG: Error reading version.properties: ${e.message}"
    }
    return 1
}

// Calculate versions once at the top level
def computedVersionName = getVersionName()
def computedVersionCode = getVersionCode()

// Logic to increment version code ONLY during a real build
// This prevents the version code from skipping numbers during Gradle syncs
def runTasks = gradle.startParameter.taskNames
if (runTasks.any { it.toLowerCase().contains("assemble") || it.toLowerCase().contains("bundle") }) {
    computedVersionCode++
    def versionPropsFile = file('version.properties')
    def props = new Properties()
    if (versionPropsFile.exists()) {
        versionPropsFile.withInputStream { props.load(it) }
    }
    props['VERSION_CODE'] = computedVersionCode.toString()
    versionPropsFile.withOutputStream { props.store(it, "Auto-incremented during build") }
}

android {
    namespace "com.abachaonline.app"
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.abachaonline.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        
        // These MUST be set here for the manifest merger to pick them up
        versionCode computedVersionCode
        versionName computedVersionName
        
        println "-------------------------------------------------------"
        println " BUILDING: AbachaOnline v${computedVersionName} (Code: ${computedVersionCode})"
        println "-------------------------------------------------------"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Rename the output APK to include version info
    applicationVariants.all { variant ->
        variant.outputs.all {
            // This only affects APKs, not AABs (bundles)
            if (outputFileName.endsWith('.apk')) {
                outputFileName = "AbachaOnline-v${computedVersionName}-${computedVersionCode}-${variant.name}.apk"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, plugin not applied")
}
